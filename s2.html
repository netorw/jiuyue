<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP 动画纯前端一键转 MP4 终极测试</title>
    
    <script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 📱 手机端自适应缩放外壳：让 1280x720 的高清大舞台完美缩放配合手机屏幕 */
        .stage-container {
            width: 90vw;
            height: calc(90vw * 9 / 16); /* 锁定 16:9 比例 */
            overflow: hidden;
            position: relative;
            border: 2px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* 🎬 真实的网页录制舞台（纯普通的 HTML/CSS 元素，绝非 Canvas） */
        #stage {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            position: absolute;
            left: 0; top: 0;
            /* 关键点：用 CSS 强行整体缩放，无论手机多小都能看清，且不破坏内部 1280x720 像素解析度 */
            transform: scale(calc(90vw / 1280));
            transform-origin: left top;
        }

        /* 舞台内的普通 HTML/CSS 动效元素 */
        .neon-box {
            width: 150px;
            height: 150px;
            background-color: #38bdf8;
            border-radius: 20px;
            position: absolute;
            left: 100px;
            top: 280px;
            box-shadow: 0 0 40px #38bdf8;
        }
        .text-glow {
            position: absolute;
            font-size: 3.5rem;
            font-weight: 900;
            left: 450px;
            top: 320px;
            letter-spacing: 4px;
            opacity: 0;
        }

        /* 控制 UI 区 */
        .controls {
            margin-top: 30px;
            text-align: center;
        }
        button {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }
        button:disabled {
            background: #475569;
            box-shadow: none;
        }
        #status {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <div id="stage">
            <div class="neon-box"></div>
            <div class="text-glow">GSAP ENGINE</div>
        </div>
    </div>
    
    <div class="controls">
        <button id="start-btn" onclick="startRendering()">开始纯前端渲染 MP4 (10秒)</button>
        <div id="status">准备就绪 | 点击上方按钮开始</div>
    </div>

    <script type="module">
        import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs';

        // ==========================================
        // 🛠️ 使用 GSAP 编写你的网页动画
        // ==========================================
        // 注意：必须设置 paused: true，让动画停下，交由我们的录制脚本按帧来“拨动发条”
        const tl = gsap.timeline({ paused: true });
        
        tl.to(".neon-box", { duration: 4, x: 800, rotation: 360, borderRadius: "50%", backgroundColor: "#ec4899", boxShadow: "0 0 50px #ec4899", ease: "power2.inOut" })
          .to(".text-glow", { duration: 2, opacity: 1, y: -50, color: "#a855f7", ease: "back.out(1.7)" }, "-=2")
          .to(".neon-box", { duration: 4, x: 450, y: -150, scale: 0.5, ease: "sine.inOut" });


        // ==========================================
        // 🎬 核心利用 WebCodecs 硬核渲染并导出 MP4 
        // ==========================================
        window.startRendering = async () => {
            const btn = document.getElementById('start-btn');
            const status = document.getElementById('status');
            btn.disabled = true;

            // --- 配置参数 ---
            const fps = 30;                 // 锁定每秒30帧
            const totalSeconds = 10;        // 🎬【改这里！】想录长视频，直接把 10 改成 50 即可
            const totalFrames = fps * totalSeconds;

            try {
                // 1. 初始化剪辑师 Muxer (锁死 720P MP4 格式)
                let muxer = new Muxer({
                    target: new ArrayBufferTarget(),
                    video: {
                        codec: 'avc',
                        width: 1280,
                        height: 720
                    },
                    firstTimestampBehavior: 'offset'
                });

                // 2. 调用手机浏览器自带的硬件视频编码器 (WebCodecs API)
                let videoEncoder = new VideoEncoder({
                    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                    error: (e) => {
                        status.innerText = "芯片编码发生错误: " + e.message;
                        btn.disabled = false;
                    }
                });

                // 配置编码器级别
                videoEncoder.configure({
                    codec: 'avc1.640028', // H.264 高级配置文件，通吃所有安卓相册
                    width: 1280,
                    height: 720,
                    bitrate: 6000000      // 6Mbps 保证超清不模糊
                });

                // 3. 开始执行“定格拍照”核心循环
                for (let i = 0; i < totalFrames; i++) {
                    // 更新手机界面上的进度提示
                    status.innerText = `⚡ 正在硬核渲染中: ${Math.round((i / totalFrames) * 100)}% (${i}/${totalFrames} 帧)`;

                    // 💡 拨动 GSAP 的时间发条：强制让动画走到对应的具体时间点
                    const timePosition = i / fps;
                    tl.seek(timePosition);

                    // 给浏览器留一个微小的微秒间隙，让它把当帧的 CSS 样式排版绘制完成
                    await new Promise(resolve => requestAnimationFrame(resolve));

                    // 📷 摄影师登场：把纯普通的 HTML/CSS 舞台强行“拍”成 Canvas 画布
                    const canvasFrame = await modernScreenshot.domToCanvas(document.getElementById('stage'));

                    // 包装成浏览器芯片认识的原生 VideoFrame，并打上微秒时间戳
                    const timestampMicros = Math.round(timePosition * 1000000);
                    const videoFrame = new VideoFrame(canvasFrame, { timestamp: timestampMicros });

                    // 送进安卓手机芯片进行硬件级别的 MP4 压缩
                    videoEncoder.encode(videoFrame);

                    // 🔥 极其重要：立刻销毁当前这一帧大图的物理内存！
                    // 这样手机内存里永远只保存一帧图，录 50 秒甚至 5 分钟也绝对不会闪退
                    videoFrame.close(); 
                }

                // 4. 收尾打包
                status.innerText = "🚀 最后一级画面封装中，请稍候...";
                await videoEncoder.flush();
                muxer.finalize();

                // 5. 将芯片处理完的二进制数据，凭空拧成一个真实的 .mp4 文件
                const { buffer } = muxer.target;
                const blob = new Blob([buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);

                // 自动弹出手机浏览器的系统下载
                const downloadLink = document.createElement('a');
                downloadLink.href = videoUrl;
                downloadLink.download = 'Mobile_GSAP_Render.mp4';
                document.body.appendChild(downloadLink);
                downloadLink.click();

                // 资源释放
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(videoUrl);

                status.innerText = "🎉 纯正 MP4 视频生成完毕！已成功保存至手机相册/下载目录！";
                btn.disabled = false;

            } catch (err) {
                status.innerText = "❌ 您的浏览器不支持原生的硬件视频编码(WebCodecs)。";
                console.error(err);
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
